name: Continuous Deployment
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  ## Required by the generate attestations
  id-token: write
  attestations: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
          generate_attestations: true
